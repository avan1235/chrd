name: Publish Client

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-web:
    name: Build web release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout to push branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Extract version from tag
        uses: damienaicheh/extract-version-from-tag-action@v1.3.0

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: 21
          distribution: 'corretto'

      - name: Build WASM and JS Distribution
        if: job.status == 'success'
        run: |
          export GRADLE_USER_HOME=$(pwd)/.gradle
          export CORS_URL=${{ secrets.CORS_URL }}
          export SUBVERSION_PL_SONGS_ORIGIN_URL=${{ secrets.SUBVERSION_PL_SONGS_ORIGIN_URL }}
          export SUBVERSION_EN_SONGS_ORIGIN_URL=${{ secrets.SUBVERSION_EN_SONGS_ORIGIN_URL }}
          chmod +x ./gradlew
          ./gradlew webApp:composeCompatibilityBrowserDistribution
        env:
          VERSION: ${{ env.MAJOR }}.${{ env.MINOR }}.${{ env.PATCH }}

      - name: Inject Cache Version into Service Worker
        if: job.status == 'success'
        run: |
          SW_PATH="./webApp/build/dist/composeWebCompatibility/productionExecutable/service-worker.js"
          NEW_VERSION="v${{ env.MAJOR }}.${{ env.MINOR }}.${{ env.PATCH }}"
          
          echo "Replacing placeholder with $NEW_VERSION in $SW_PATH"
          sed -i "s/{{OVERRIDE THIS IN DEPLOYMENT}}/$NEW_VERSION/g" $SW_PATH

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./webApp/build/dist/composeWebCompatibility/productionExecutable
          force_orphan: true
          cname: chrd.procyk.in
